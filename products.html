<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>
    <link rel="stylesheet" href="products.css">
</head>
<body>

    <header>
        <h1>Our Products</h1>
        <p>Choose your favourite product</p>
    </header>

    <main class="product-container">

        <div class="product-card">
            <div class="product-image">🎧</div>
            <h2>Headphones</h2>
            <p>High-quality sound for everyday use.</p>
            <h3>₹1,499</h3>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <div class="product-image">⌚</div>
            <h2>Smart Watch</h2>
            <p>Track your fitness and daily activities.</p>
            <h3>₹2,499</h3>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <div class="product-image">📱</div>
            <h2>Smartphone</h2>
            <p>Enjoy a smooth and powerful experience.</p>
            <h3>₹14,999</h3>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <div class="product-image">💻</div>
            <h2>Laptop</h2>
            <p>Perfect for study, coding and work.</p>
            <h3>₹49,999</h3>
            <button>Buy Now</button>
        </div>

    </main>

</body>
</html>
