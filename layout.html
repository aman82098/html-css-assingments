<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid Layout</title>
    <link rel="stylesheet" href="layout.css">
</head>
<body>

    <div class="page-layout">

        <header class="header">
            <h1>ShopEasy</h1>
            <p>Your Online Store</p>
        </header>

        <aside class="sidebar">
            <h2>Categories</h2>
            <a href="#">Electronics</a>
            <a href="#">Clothing</a>
            <a href="#">Accessories</a>
            <a href="#">Home & Living</a>
        </aside>

        <main class="main-content">
            <h2>Featured Products</h2>

            <section class="product-grid">
                <article class="product-card">
                    <div class="product-image">🎧</div>
                    <h3>Headphones</h3>
                    <p>₹1,499</p>
                    <button>Buy Now</button>
                </article>

                <article class="product-card">
                    <div class="product-image">⌚</div>
                    <h3>Smart Watch</h3>
                    <p>₹2,499</p>
                    <button>Buy Now</button>
                </article>

                <article class="product-card">
                    <div class="product-image">📱</div>
                    <h3>Smartphone</h3>
                    <p>₹14,999</p>
                    <button>Buy Now</button>
                </article>

                <article class="product-card">
                    <div class="product-image">💻</div>
                    <h3>Laptop</h3>
                    <p>₹49,999</p>
                    <button>Buy Now</button>
                </article>
            </section>
        </main>

        <footer class="footer">
            <p>© 2026 ShopEasy. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
