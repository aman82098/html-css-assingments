<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful moments from nature</p>

    <main class="gallery">
        <div class="photo">
            <img src="https://picsum.photos/id/1015/400/300" alt="Mountain river">
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1011/400/300" alt="Nature landscape">
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1016/400/300" alt="Mountain view">
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1025/400/300" alt="Dog portrait">
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1035/400/300" alt="Green forest">
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1043/400/300" alt="Ocean view">
        </div>
    </main>

</body>
</html>
