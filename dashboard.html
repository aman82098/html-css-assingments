<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard">

        <header class="header">
            <h1>My Dashboard</h1>
            <p>Welcome back, User!</p>
        </header>

        <nav class="sidebar">
            <h2>Menu</h2>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Messages</a>
            <a href="#">Settings</a>
        </nav>

        <main class="main">
            <h2>Overview</h2>

            <section class="stats">
                <div class="card">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                </div>

                <div class="card">
                    <h3>Revenue</h3>
                    <p>₹25,000</p>
                </div>

                <div class="card">
                    <h3>Orders</h3>
                    <p>320</p>
                </div>
            </section>

            <section class="activity">
                <h2>Recent Activity</h2>
                <p>New user registered.</p>
                <p>New order received.</p>
                <p>Monthly report updated.</p>
            </section>
        </main>

        <footer class="footer">
            <p>© 2026 My Dashboard</p>
        </footer>

    </div>

</body>
</html>
