<!DOCTYPE html>

    <title>Three Card Designs</title>
    <link rel="stylesheet" href="cards.css">
</head>
<body>

    <h1>Three Different Card Designs</h1>

    <div class="container">

        <div class="card card-one">

            <p>This card has a shadow effect.</p>
        </div>

    </div>
